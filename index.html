<style>
/* Layout: carte plein écran, panneau latéral (bas d'écran sur téléphone), orange de sécurité comme seul accent */
:root {
  --bg: #eef0e8;
  --panel: #fbfbf7;
  --ink: #1f2a1c;
  --muted: #5f6b58;
  --line: #d6dbcc;
  --blaze: #e8591a;
  --blaze-ink: #ffffff;
  --moss: #3f5a2e;
  --warn: #b3261e;
  --ok: #2f7d3a;
  --map-fallback: #4a5a3c;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141912; --panel: #1b2218; --ink: #e6eadf; --muted: #9ba692; --line: #2f3a2a;
  --blaze: #ff6a26; --blaze-ink: #1b1005; --moss: #8fb070; --warn: #ff7a70; --ok: #6cc47a; --map-fallback: #26301f;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141912; --panel: #1b2218; --ink: #e6eadf; --muted: #9ba692; --line: #2f3a2a;
  --blaze: #ff6a26; --blaze-ink: #1b1005; --moss: #8fb070; --warn: #ff7a70; --ok: #6cc47a; --map-fallback: #26301f;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blaze); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 1fr 360px; }
#map { height: 100%; background: var(--map-fallback); }
#map.no-tiles { background:
  repeating-linear-gradient(45deg, transparent 0 22px, rgba(255,255,255,.04) 22px 23px), var(--map-fallback); }

/* barre d'outils flottante */
.tools { position: absolute; z-index: 500; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 400px); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel);
  padding: 8px 12px; border-radius: 6px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.tbtn.on { background: var(--blaze); color: var(--blaze-ink); border-color: var(--blaze); }
.tbtn svg { width: 16px; height: 16px; }

.drawbar { position: absolute; z-index: 600; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--panel); padding: 8px 10px 8px 14px; border-radius: 8px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.35); max-width: calc(100% - 32px); }
.drawbar button { border: 0; padding: 6px 12px; border-radius: 5px; font-weight: 600; background: var(--blaze); color: var(--blaze-ink); }
.drawbar button.ghost { background: transparent; color: var(--panel); border: 1px solid currentColor; }

.notice { position: absolute; z-index: 550; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blaze); padding: 10px 12px; border-radius: 6px; font-size: 13px; line-height: 1.4; }

/* panneau */
.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.ph { padding-block: 16px 10px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.ph h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .01em; margin: 0; text-wrap: balance; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
const KEY = 'carnet-battue-v2';
const ZONE_COLORS = ['#ff8a3d', '#4fc3f7', '#c5e86c', '#f48fb1', '#ffd54f'];
const GIBIER = { sanglier: '#e8591a', chevreuil: '#f2c14e', cerf: '#c77dff', chamois: '#7fd1ae', renard: '#ff8fa3', autre: '#ffffff' };
// espèces proposées au poste pour « Animal vu » ; f = féminin (« vue »)
const ESPECES = [
  { id: 'sanglier', nom: 'Sanglier' }, { id: 'renard', nom: 'Renard' },
  { id: 'chevreuil', nom: 'Chevreuil' }, { id: 'chevrette', nom: 'Chevrette', f: true }, { id: 'brocard', nom: 'Brocard' },
  { id: 'cerf', nom: 'Cerf' }, { id: 'biche', nom: 'Biche', f: true }, { id: 'faon', nom: 'Faon' },
  { id: 'chamois', nom: 'Chamois' }, { id: 'autre', nom: 'Autre animal' }
];
const SAFETY_DEG = 30; // règle des 30° : on ne tire pas à moins de 30° d'un poste voisin

// ---------- données d'exemple ----------
const C = [44.0342, 3.8915];
function sample() {
  return {
    terrain: 'Territoire de la Rouvière',
    cur: 'b1',
    battues: [
     { id: 'b1', nom: 'La Combe', couleur: '#ff8a3d', notes: 'Rond à 8 h au rendez-vous de chasse.',
       zone: [[44.0405,3.8815],[44.0398,3.8985],[44.0352,3.9012],[44.0282,3.9002],[44.0279,3.8930],[44.0318,3.8832]],
       postes: [
      { id: 'p1', num: 1, nom: 'Le Chêne fourchu', chasseur: 'Jean-Marc', lat: 44.0381, lng: 3.8842, orient: 150, ouv: 90, photo: '', notes: 'Dos au chemin. Tir à la descente uniquement.' },
      { id: 'p2', num: 2, nom: 'Croisée du ruisseau', chasseur: 'Sylvie', lat: 44.0366, lng: 3.8902, orient: 175, ouv: 80, photo: '', notes: 'Le passage se fait souvent 20 m plus bas.' },
      { id: 'p3', num: 3, nom: 'Bord de la coupe', chasseur: 'Pascal', lat: 44.0349, lng: 3.8961, orient: 200, ouv: 90, photo: '', notes: '' },
      { id: 'p4', num: 4, nom: 'La Pierre plate', chasseur: '', lat: 44.0318, lng: 3.8995, orient: 250, ouv: 70, photo: '', notes: 'Poste haut, bonne vue sur la combe.' },
      { id: 'p5', num: 5, nom: 'Col des Fonts', chasseur: 'Didier', lat: 44.0289, lng: 3.8968, orient: 320, ouv: 90, photo: '', notes: '' }
     ] },
     { id: 'b2', nom: 'Bois des Fonts', couleur: '#4fc3f7', notes: 'Traque d\'après-midi, vent d\'ouest.',
       zone: [[44.0395,3.9035],[44.0392,3.9150],[44.0330,3.9175],[44.0296,3.9120],[44.0305,3.9040]],
       postes: [
      { id: 'q1', num: 1, nom: 'Le Grand Pin', chasseur: 'Sylvie', lat: 44.0378, lng: 3.9060, orient: 160, ouv: 80, photo: '', notes: '' },
      { id: 'q2', num: 2, nom: 'Fontaine', chasseur: 'Pascal', lat: 44.0352, lng: 3.9105, orient: 230, ouv: 80, photo: '', notes: 'Attention au chemin de randonnée derrière.' },
      { id: 'q3', num: 3, nom: 'La Barrière', chasseur: '', lat: 44.0318, lng: 3.9135, orient: 200, ouv: 80, photo: '', notes: '' }
     ] }
    ],
    drailles: [
      { id: 'd1', nom: 'Coulée de la combe', gibier: 'sanglier', notes: 'Souilles en bas, très fréquentée à l\'automne.',
        pts: [[44.0408,3.8890],[44.0388,3.8899],[44.0370,3.8909],[44.0352,3.8925],[44.0333,3.8931],[44.0310,3.8922]] },
      { id: 'd2', nom: 'Passage des ronciers', gibier: 'chevreuil', notes: '',
        pts: [[44.0331,3.8860],[44.0337,3.8900],[44.0340,3.8946],[44.0331,3.8990],[44.0336,3.9030]] },
      { id: 'd3', nom: 'Sortie vers les châtaigniers', gibier: 'sanglier', notes: 'Remise probable dans le roncier nord.',
        pts: [[44.0298,3.8870],[44.0302,3.8910],[44.0300,3.8952],[44.0286,3.8990]] }
    ],
    routes: [ { nom: 'D 907', pts: [[44.0274,3.8800],[44.0281,3.8870],[44.0277,3.8940],[44.0266,3.9010],[44.0258,3.9080]] },
              { nom: 'Voie ferrée', pts: [[44.0430,3.8790],[44.0425,3.8900],[44.0432,3.9010],[44.0440,3.9090]] } ]
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch (e) { S = sample(); }
if (!S.routes) S.routes = sample().routes;
if (!S.battues) S = sample();
const B = () => S.battues.find(b => b.id === S.cur) || null;
const P = () => B() ? B().postes : [];
const events = [], vus = [];
function logEv(kind, html) { const t = new Date(); events.unshift({ kind, html, t: t.toTimeString().slice(0,5) }); if (events.length > 60) events.pop();
  document.getElementById('nDirect').textContent = events.length; if (tab === 'direct') renderList(); }
// les clés en _ (calques Leaflet) ne sont pas des données : on les exclut
const toJSON = () => JSON.stringify(S, (k, v) => k.startsWith('_') ? undefined : v);
function save() { try { localStorage.setItem(KEY, toJSON()); } catch (e) { notice('Sauvegarde impossible sur cet appareil (espace plein ou navigation privée). Les modifications seront perdues à la fermeture.'); } }

// ---------- carte ----------
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView(C, 16);
L.control.zoom({ position: 'bottomright' }).addTo(map);
const ign = (layer, fmt) => 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=' + layer + '&STYLE=normal&TILEMATRIXSET=PM&FORMAT=' + fmt + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const FONDS = [
  { nom: 'Satellite IGN', l: L.tileLayer(ign('ORTHOIMAGERY.ORTHOPHOTOS', 'image/jpeg'), { maxZoom: 20, maxNativeZoom: 19, attribution: '© IGN Géoplateforme' }) },
  { nom: 'Plan IGN', l: L.tileLayer(ign('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2', 'image/png'), { maxZoom: 20, maxNativeZoom: 18, attribution: '© IGN Géoplateforme' }) },
  { nom: 'Satellite monde', l: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Imagerie © Esri' }) }
];
let fondIdx = 0, tilesOk = 0, tilesErr = 0;
FONDS.forEach(f => { f.l.on('tileload', () => { tilesOk++; document.getElementById('map').classList.remove('no-tiles'); });
                     f.l.on('tileerror', () => { tilesErr++; if (!tilesOk && tilesErr > 4) tileWarn(); }); });
FONDS[0].l.addTo(map);
setTimeout(() => { if (!tilesOk) tileWarn(); }, 4000);
function tileWarn() {
  document.getElementById('map').classList.add('no-tiles');
  notice('Le fond de carte ne se charge pas : vérifiez le réseau. Les postes et drailles restent utilisables.');
}
function notice(t) { const n = document.getElementById('notice'); n.textContent = t + ' (touchez pour fermer)'; n.hidden = false; n.onclick = () => n.hidden = true; }

const gRoutes = L.layerGroup().addTo(map), gVus = L.layerGroup().addTo(map);
const gZones = L.layerGroup().addTo(map);
const gPostes = L.layerGroup().addTo(map), gSect = L.layerGroup().addTo(map), gDr = L.layerGroup().addTo(map);

// géodésie simple (petites distances)
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) { const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const x = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function bearing(a, b) { const y = Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0]))*Math.sin(rad(b[0])) - Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1])); return (deg(Math.atan2(y, x)) + 360) % 360; }
function dest(a, brg, m) { const d = m / R, t = rad(brg), p1 = rad(a[0]), l1 = rad(a[1]);
  const p2 = Math.asin(Math.sin(p1)*Math.cos(d) + Math.cos(p1)*Math.sin(d)*Math.cos(t));
  const l2 = l1 + Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(p1), Math.cos(d) - Math.sin(p1)*Math.sin(p2)); return [deg(p2), deg(l2)]; }
const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const fmtM = m => m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(1).replace('.', ',') + ' km';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Un poste est en conflit si un voisin se trouve dans son secteur de tir élargi de 30° de chaque côté
function conflits(p) {
  return P().filter(q => q.id !== p.id && dist([p.lat,p.lng],[q.lat,q.lng]) < 400 &&
    angDiff(bearing([p.lat,p.lng],[q.lat,q.lng]), p.orient) < p.ouv/2 + SAFETY_DEG);
}

function drawPostes() {
  gPostes.clearLayers(); gSect.clearLayers();
  P().forEach(p => {
    const c = conflits(p);
    const pts = [[p.lat,p.lng]];
    for (let a = p.orient - p.ouv/2; a <= p.orient + p.ouv/2 + .01; a += 5) pts.push(dest([p.lat,p.lng], a, 120));
    L.polygon(pts, { color: c.length ? '#ff5a4f' : '#ff8a3d', weight: 1.5, fillOpacity: .18, dashArray: c.length ? '4 4' : null, interactive: false }).addTo(gSect);
    const m = L.marker([p.lat,p.lng], { draggable: true, icon: L.divIcon({ className: '', html: '<div class="mk-poste' + (c.length ? ' alert' : '') + '">' + p.num + '</div>', iconSize: [30,30], iconAnchor: [15,15] }) });
    m.bindPopup(() => popPoste(p), { maxWidth: 260, autoPanPaddingTopLeft: L.point(12, 70) });
    m.on('dragend', e => { const ll = e.target.getLatLng(); p.lat = ll.lat; p.lng = ll.lng; save(); render(); });
    m.addTo(gPostes); p._m = m;
  });
}
function popPoste(p) {
  const c = conflits(p);
  const d = document.createElement('div'); d.className = 'pop';
  d.innerHTML = '<h3>Poste ' + p.num + ' · ' + esc(p.nom) + '</h3>' +
    (p.photo ? '<img alt="Photo du poste ' + p.num + '" src="' + p.photo + '">' : '') +
    '<div class="m">' + (p.chasseur ? 'Posté : <b>' + esc(p.chasseur) + '</b><br>' : 'Poste libre<br>') +
    'Tir vers ' + Math.round(p.orient) + '° · ouverture ' + p.ouv + '°' + (p.notes ? '<br>' + esc(p.notes) : '') + '</div>' +
    (c.length ? '<div style="margin-top:6px"><span class="chip warn">Angle 30° : poste' + (c.length > 1 ? 's ' : ' ') + c.map(q => q.num).join(', ') + '</span></div>' : '');
  const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Modifier'; b.onclick = () => { map.closePopup(); editPoste(p); };
  const v = document.createElement('button'); v.type = 'button'; v.textContent = 'Animal vu'; v.style.marginLeft = '6px';
  // remplacement différé : sinon Leaflet voit un clic hors du popup (bouton détaché) et le referme
  v.onclick = () => setTimeout(() => { const cp = document.createElement('div'); cp.innerHTML = '<div class="m" style="margin-top:8px">Espèce vue :</div>';
    let esp = ESPECES[0];
    const ch = document.createElement('div'); ch.className = 'especes';
    ESPECES.forEach(e => { const eb = document.createElement('button'); eb.type = 'button'; eb.textContent = e.nom; eb.setAttribute('aria-pressed', e === esp);
      eb.onclick = () => { esp = e; ch.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === eb)); }; ch.appendChild(eb); });
    cp.appendChild(ch);
    cp.insertAdjacentHTML('beforeend', '<div class="m" style="margin-top:8px">Part vers :</div>');
    const g = document.createElement('div'); g.className = 'compass';
    [['NO',315],['N',0],['NE',45],['O',270],null,['E',90],['SO',225],['S',180],['SE',135]].forEach(x => {
      if (!x) { g.insertAdjacentHTML('beforeend', '<span>' + p.num + '</span>'); return; }
      const bb = document.createElement('button'); bb.type = 'button'; bb.textContent = x[0]; bb.onclick = () => { animalVu(p, x[1], x[0], esp); map.closePopup(); }; g.appendChild(bb); });
    cp.appendChild(g); v.replaceWith(cp);
    // le popup a grandi : on le recadre pour qu'il reste sous la barre d'outils
    const pop = p._m.getPopup(); pop._updateLayout(); pop._updatePosition(); pop._adjustPan(); }, 0);
  d.appendChild(b); d.appendChild(v); return d;
}

const DIRS = { N: 'le nord', NE: 'le nord-est', E: 'l\'est', SE: 'le sud-est', S: 'le sud', SO: 'le sud-ouest', O: 'l\'ouest', NO: 'le nord-ouest' };
function animalVu(p, brg, lbl, esp = ESPECES[0]) {
  const a = [p.lat, p.lng], end = dest(a, brg, 260);
  const line = L.polyline([a, end], { color: '#ffffff', weight: 3, dashArray: '2 6', interactive: false }).addTo(gVus);
  const head = L.polygon([end, dest(end, brg + 150, 35), dest(end, brg - 150, 35)], { color: '#fff', fillColor: '#ff6a26', fillOpacity: 1, weight: 2, interactive: false }).addTo(gVus);
  setTimeout(() => { gVus.removeLayer(line); gVus.removeLayer(head); }, 90000);
  // postes vers lesquels l'animal se dirige (à moins de 35° de sa course, sous 700 m)
  const cibles = P().filter(q => q.id !== p.id && dist(a, [q.lat,q.lng]) < 700 && angDiff(bearing(a, [q.lat,q.lng]), brg) < 35).map(q => q.num);
  logEv('vu', '<b>Poste ' + p.num + ' : ' + esp.nom.toLowerCase() + (esp.f ? ' vue' : ' vu') + '</b>, part vers ' + DIRS[lbl] + '.' + (cibles.length ? ' Postes prévenus : ' + cibles.join(', ') + '.' : ''));
  tab = 'direct'; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x.id === 'tab-direct')); renderList();
}
function drawDrailles() {
  gDr.clearLayers();
  S.drailles.forEach(d => {
    const col = GIBIER[d.gibier] || '#fff';
    L.polyline(d.pts, { color: '#000', weight: 7, opacity: .35 }).addTo(gDr);
    const l = L.polyline(d.pts, { color: col, weight: 4, dashArray: '9 7', lineCap: 'round' }).addTo(gDr);
    l.bindPopup(() => { const el = document.createElement('div'); el.className = 'pop';
      el.innerHTML = '<h3>' + esc(d.nom) + '</h3><div class="m">Gibier : ' + esc(d.gibier) + ' · ' + fmtM(len(d.pts)) + (d.notes ? '<br>' + esc(d.notes) : '') + '</div>';
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Modifier'; b.onclick = () => { map.closePopup(); editDraille(d); }; el.appendChild(b); return el; });
    d._l = l;
  });
}
// surface approchée d'un polygone (projection plane locale), en hectares
function surfaceHa(pts) { const k = Math.cos(rad(pts[0][0])) * 111320, m = 110540; let a = 0;
  for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[1]*k * q[0]*m - q[1]*k * p[0]*m; }
  return Math.abs(a) / 2 / 10000; }
const fmtHa = h => Math.round(h) + ' ha';
function drawZones() {
  gZones.clearLayers();
  S.battues.forEach(b => {
    const on = b.id === S.cur;
    const z = L.polygon(b.zone, { color: b.couleur, weight: on ? 3 : 2, dashArray: on ? null : '6 6', fillColor: b.couleur, fillOpacity: on ? .10 : .05 }).addTo(gZones);
    z.bindTooltip(esc(b.nom), { permanent: true, direction: 'center', className: 'zone-lbl' });
    z.on('click', e => { if (mode) return; L.DomEvent.stop(e); selectBattue(b.id, true); });
    b._z = z;
  });
}
function selectBattue(id, fit) {
  S.cur = id; save(); tab = 'battue'; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x.id === 'tab-battue'));
  render(); if (fit && B()) map.fitBounds(B()._z.getBounds(), { padding: [30, 30] });
}
function drawRoutes() { gRoutes.clearLayers();
  S.routes.forEach(r => { L.polyline(r.pts, { color: '#000', weight: 8, opacity: .45, interactive: false }).addTo(gRoutes);
    L.polyline(r.pts, { color: '#e0e0e0', weight: 4, dashArray: r.nom.startsWith('Voie') ? '2 6' : null, interactive: false }).addTo(gRoutes)
      .bindTooltip(r.nom, { permanent: true, direction: 'center', className: 'road-lbl' }); }); }
const len = pts => pts.reduce((s, p, i) => i ? s + dist(pts[i-1], p) : 0, 0);

// ---------- liste latérale ----------
let tab = 'battue';
function renderList() {
  document.getElementById('nBattues').textContent = S.battues.length;
  document.getElementById('nDrailles').textContent = S.drailles.length;
  document.getElementById('nDirect').textContent = events.length;
  const el = document.getElementById('list'); el.innerHTML = '';
  if (tab === 'battue' && !B()) {
    el.insertAdjacentHTML('beforeend', '<div class="section-note">Choisissez la battue selon la zone que vous voulez faire, puis placez ses postes. Touchez une zone sur la carte pour l\'ouvrir.</div>');
    S.battues.forEach(b => {
      const r = row('<div class="swatch" style="border-color:' + b.couleur + ';color:' + b.couleur + '">' + esc(b.nom[0].toUpperCase()) + '</div>',
        esc(b.nom), b.postes.length + ' poste' + (b.postes.length > 1 ? 's' : '') + ' · ' + b.postes.filter(p => p.chasseur).length + ' occupé' + (b.postes.filter(p => p.chasseur).length > 1 ? 's' : ''),
        fmtHa(surfaceHa(b.zone)));
      r.onclick = () => selectBattue(b.id, true);
      el.appendChild(r);
    });
    const add = document.createElement('button'); add.type = 'button'; add.className = 'addrow'; add.id = 'btnNewBattue'; add.textContent = '+ Nouvelle battue : dessiner la zone';
    add.onclick = () => startDraw('zone'); el.appendChild(add);
  } else if (tab === 'battue') {
    const b = B();
    const h = document.createElement('div'); h.className = 'bhead';
    h.innerHTML = '<button type="button" class="back" id="btnBack">‹ Battues</button><h2 style="color:inherit"><span style="color:' + b.couleur + '">■</span> ' + esc(b.nom) + '</h2><button type="button" class="edit" id="btnEditB">Modifier</button>';
    el.appendChild(h);
    h.querySelector('#btnBack').onclick = () => { S.cur = null; save(); render(); map.fitBounds(L.featureGroup(S.battues.map(x => x._z)).getBounds(), { padding: [20, 20] }); };
    h.querySelector('#btnEditB').onclick = () => editBattue(b);
    el.insertAdjacentHTML('beforeend', '<div class="section-note">' + fmtHa(surfaceHa(b.zone)) + (b.notes ? ' · ' + esc(b.notes) : '') + '<br>Touchez « Poste » puis la carte pour en ajouter un. Faites glisser un numéro pour le déplacer. Le cône passe en rouge si un voisin est à moins de 30° du secteur de tir.</div>');
    if (!b.postes.length) el.insertAdjacentHTML('beforeend', '<div class="empty">Aucun poste dans cette battue. Touchez « Poste » puis la carte pour placer le premier.</div>');
    [...b.postes].sort((a, b) => a.num - b.num).forEach(p => {
      const c = conflits(p);
      const r = row((p.photo ? '<img class="thumb" alt="" src="' + p.photo + '">' : '<div class="num">' + p.num + '</div>'),
        'Poste ' + p.num + ' · ' + esc(p.nom), (p.chasseur ? esc(p.chasseur) : 'Libre') + (p.photo ? '' : ' · sans photo'),
        c.length ? '<span class="chip warn">30°</span>' : '<span class="chip ok">OK</span>');
      r.onclick = () => { map.setView([p.lat,p.lng], Math.max(map.getZoom(), 17)); p._m.openPopup(); if (innerWidth <= 760) scrollTo(0,0); };
      el.appendChild(r);
    });
  } else if (tab === 'drailles') {
    el.insertAdjacentHTML('beforeend', '<div class="section-note">Touchez « Draille », puis posez les points le long du passage. La couleur indique le gibier.</div>');
    if (!S.drailles.length) el.insertAdjacentHTML('beforeend', '<div class="empty">Aucune draille tracée.</div>');
    S.drailles.forEach(d => {
      const b = row('<div class="thumb" style="background:' + (GIBIER[d.gibier] || '#ccc') + ';color:#1f2a1c">' + esc(d.gibier[0].toUpperCase()) + '</div>',
        esc(d.nom), esc(d.gibier) + (d.notes ? ' · ' + esc(d.notes) : ''), fmtM(len(d.pts)));
      b.onclick = () => { map.fitBounds(d._l.getBounds(), { padding: [40,40] }); d._l.openPopup(); };
      el.appendChild(b);
    });
  } else if (tab === 'direct') {
    el.insertAdjacentHTML('beforeend', '<div class="section-note">Journal de la battue en cours. Depuis un poste, touchez « Animal vu » pour prévenir les voisins de la direction de fuite.</div>');
    if (!events.length) el.insertAdjacentHTML('beforeend', '<div class="empty">Rien pour l\'instant. Les signalements des postes apparaîtront ici.</div>');
    events.forEach(e => el.insertAdjacentHTML('beforeend', '<div class="ev ' + e.kind + '"><time>' + e.t + '</time><div>' + e.html + '</div></div>'));
  }
}
function row(left, t, m, r) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'row';
  b.innerHTML = left + '<div style="min-width:0"><div class="t">' + t + '</div><div class="m">' + m + '</div></div><div class="r">' + r + '</div>';
  return b;
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  tab = t.id.slice(4); document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t)); renderList();
});

// ---------- éditeurs ----------
const bg = document.getElementById('sheetBg'), sheet = document.getElementById('sheet');
function openSheet(html, onSubmit, onDelete) {
  sheet.innerHTML = html; bg.hidden = false;
  sheet.onsubmit = e => { e.preventDefault(); onSubmit(new FormData(sheet)); bg.hidden = true; };
  sheet.querySelector('[data-cancel]').onclick = () => { bg.hidden = true; };
  const del = sheet.querySelector('[data-del]');
  if (del) del.onclick = () => { if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Confirmer la suppression'; return; } onDelete(); bg.hidden = true; };
  const f = sheet.querySelector('input,select'); if (f) f.focus();
}
bg.addEventListener('click', e => { if (e.target === bg) bg.hidden = true; });
addEventListener('keydown', e => { if (e.key === 'Escape') { bg.hidden = true; stopDraw(); } });

function editPoste(p, isNew) {
  let photo = p.photo;
  openSheet(
    '<h2>' + (isNew ? 'Nouveau poste' : 'Poste ' + p.num) + '</h2>' +
    '<div class="two"><div class="field"><label for="f-num">Numéro</label><input id="f-num" name="num" type="number" min="1" value="' + p.num + '" required></div>' +
    '<div class="field"><label for="f-chas">Chasseur posté</label><input id="f-chas" name="chasseur" value="' + esc(p.chasseur) + '" placeholder="Libre"></div></div>' +
    '<div class="field"><label for="f-nom">Nom du poste</label><input id="f-nom" name="nom" value="' + esc(p.nom) + '" required></div>' +
    '<div class="two"><div class="field"><label for="f-or">Direction de tir (°)</label><input id="f-or" name="orient" type="number" min="0" max="359" value="' + Math.round(p.orient) + '"></div>' +
    '<div class="field"><label for="f-ouv">Ouverture (°)</label><input id="f-ouv" name="ouv" type="number" min="10" max="180" value="' + p.ouv + '"></div></div>' +
    '<div class="field"><label for="f-photo">Photo du poste</label><div class="photo-pick">' + (photo ? '<img id="pv" alt="" src="' + photo + '">' : '<div class="ph0" id="pv">Aucune</div>') +
    '<input id="f-photo" type="file" accept="image/*" capture="environment"></div></div>' +
    '<div class="field"><label for="f-notes">Consignes</label><textarea id="f-notes" name="notes">' + esc(p.notes) + '</textarea></div>' +
    '<div class="actions">' + (isNew ? '<span></span>' : '<button type="button" class="btn danger" data-del>Supprimer</button>') +
    '<span style="display:flex;gap:8px"><button type="button" class="btn" data-cancel>Annuler</button><button class="btn primary">Enregistrer</button></span></div>',
    fd => { Object.assign(p, { num: +fd.get('num'), nom: fd.get('nom'), chasseur: fd.get('chasseur'), orient: (+fd.get('orient') + 360) % 360, ouv: +fd.get('ouv') || 90, notes: fd.get('notes'), photo });
      if (isNew) B().postes.push(p); save(); render(); },
    () => { B().postes = B().postes.filter(q => q !== p); save(); render(); });
  sheet.querySelector('#f-photo').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 900 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = img.width * k; cv.height = img.height * k; cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      photo = cv.toDataURL('image/jpeg', .72); URL.revokeObjectURL(url);
      const pv = sheet.querySelector('#pv'); pv.outerHTML = '<img id="pv" alt="" src="' + photo + '">'; };
    img.src = url;
  };
}
function editBattue(b, isNew) {
  openSheet('<h2>' + (isNew ? 'Nouvelle battue' : esc(b.nom)) + '</h2>' +
    '<div class="field"><label for="f-bn">Nom de la battue</label><input id="f-bn" name="nom" value="' + esc(b.nom) + '" required></div>' +
    '<div class="field"><label for="f-bno">Consignes générales</label><textarea id="f-bno" name="notes" placeholder="Rendez-vous, horaires, rond de sécurité…">' + esc(b.notes) + '</textarea></div>' +
    '<div class="actions">' + (isNew ? '<span></span>' : '<button type="button" class="btn danger" data-del>Supprimer la battue</button>') +
    '<span style="display:flex;gap:8px"><button type="button" class="btn" data-cancel>Annuler</button><button class="btn primary">Enregistrer</button></span></div>',
    fd => { Object.assign(b, { nom: fd.get('nom'), notes: fd.get('notes') }); if (isNew) { S.battues.push(b); S.cur = b.id; } save(); render(); },
    () => { S.battues = S.battues.filter(x => x !== b); S.cur = null; save(); render(); });
}
function editDraille(d, isNew) {
  openSheet('<h2>' + (isNew ? 'Nouvelle draille' : esc(d.nom)) + '</h2>' +
    '<div class="field"><label for="f-dn">Nom</label><input id="f-dn" name="nom" value="' + esc(d.nom) + '" required></div>' +
    '<div class="field"><label for="f-g">Gibier</label><select id="f-g" name="gibier">' + Object.keys(GIBIER).map(g => '<option' + (g === d.gibier ? ' selected' : '') + '>' + g + '</option>').join('') + '</select></div>' +
    '<div class="field"><label for="f-dno">Observations</label><textarea id="f-dno" name="notes">' + esc(d.notes) + '</textarea></div>' +
    '<div class="actions">' + (isNew ? '<span></span>' : '<button type="button" class="btn danger" data-del>Supprimer</button>') +
    '<span style="display:flex;gap:8px"><button type="button" class="btn" data-cancel>Annuler</button><button class="btn primary">Enregistrer</button></span></div>',
    fd => { Object.assign(d, { nom: fd.get('nom'), gibier: fd.get('gibier'), notes: fd.get('notes') }); if (isNew) S.drailles.push(d); save(); render(); },
    () => { S.drailles = S.drailles.filter(x => x !== d); save(); render(); });
}

// ---------- modes de saisie sur la carte ----------
let mode = null, draft = [], draftLine = null;
const bar = document.getElementById('drawbar'), msg = document.getElementById('drawMsg'), ok = document.getElementById('drawOk');
function startDraw(m) {
  stopDraw(); mode = m; bar.hidden = false; map.getContainer().style.cursor = 'crosshair';
  if (m !== 'zone') document.getElementById(m === 'poste' ? 'btnPoste' : 'btnDraille').classList.add('on');
  msg.textContent = m === 'poste' ? 'Touchez la carte à l\'emplacement du poste' : m === 'zone' ? 'Touchez la carte pour dessiner le tour de la zone' : 'Touchez la carte pour poser les points de la draille';
  ok.hidden = m === 'poste';
}
function stopDraw() {
  mode = null; draft = []; if (draftLine) { map.removeLayer(draftLine); draftLine = null; }
  bar.hidden = true; map.getContainer().style.cursor = '';
  document.getElementById('btnPoste').classList.remove('on'); document.getElementById('btnDraille').classList.remove('on');
}
map.on('click', e => {
  if (mode === 'poste') {
    const n = P().reduce((m, p) => Math.max(m, p.num), 0) + 1;
    const p = { id: 'p' + Date.now(), num: n, nom: 'Poste ' + n, chasseur: '', lat: e.latlng.lat, lng: e.latlng.lng, orient: 180, ouv: 90, photo: '', notes: '' };
    stopDraw(); editPoste(p, true);
  } else if (mode === 'draille' || mode === 'zone') {
    draft.push([e.latlng.lat, e.latlng.lng]);
    if (!draftLine) draftLine = (mode === 'zone' ? L.polygon(draft, { color: '#fff', weight: 2, dashArray: '6 6', fillOpacity: .12 }) : L.polyline(draft, { color: '#ff8a3d', weight: 4, dashArray: '9 7' })).addTo(map);
    else draftLine.setLatLngs(draft);
    msg.textContent = draft.length + ' point' + (draft.length > 1 ? 's' : '') + ' · ' + (mode === 'zone' && draft.length > 2 ? fmtHa(surfaceHa(draft)) : fmtM(len(draft)));
  }
});
ok.onclick = () => {
  if (mode === 'zone') { if (draft.length < 3) { msg.textContent = 'Posez au moins trois points'; return; }
    const b = { id: 'b' + Date.now(), nom: 'Nouvelle battue', couleur: ZONE_COLORS[S.battues.length % ZONE_COLORS.length], notes: '', zone: draft.slice(), postes: [] };
    stopDraw(); editBattue(b, true); return; }
  if (draft.length < 2) { msg.textContent = 'Posez au moins deux points'; return; }
  const d = { id: 'd' + Date.now(), nom: 'Nouvelle draille', gibier: 'sanglier', notes: '', pts: draft.slice() }; stopDraw(); editDraille(d, true); };
document.getElementById('drawCancel').onclick = stopDraw;
document.getElementById('btnPoste').onclick = () => {
  if (mode === 'poste') return stopDraw();
  if (!B()) { tab = 'battue'; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x.id === 'tab-battue')); renderList();
    return notice('Choisissez d\'abord une battue dans l\'onglet Battue : chaque poste appartient à une battue.'); }
  startDraw('poste');
};
document.getElementById('btnDraille').onclick = () => mode === 'draille' ? stopDraw() : startDraw('draille');
document.getElementById('btnFond').onclick = () => {
  map.removeLayer(FONDS[fondIdx].l); fondIdx = (fondIdx + 1) % FONDS.length; FONDS[fondIdx].l.addTo(map);
  document.getElementById('fondLbl').textContent = FONDS[fondIdx].nom; document.getElementById('btnFond').title = 'Fond : ' + FONDS[fondIdx].nom;
};
let me = null;
document.getElementById('btnMoi').onclick = () => {
  if (!navigator.geolocation) return notice('La localisation n\'est pas disponible sur cet appareil.');
  navigator.geolocation.getCurrentPosition(p => { const ll = [p.coords.latitude, p.coords.longitude];
      if (me) map.removeLayer(me); me = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#1e88ff', fillOpacity: 1 }).addTo(map); map.setView(ll, 17); },
    () => notice('Position refusée ou indisponible. Dans cet aperçu la localisation est bloquée ; elle fonctionne dans le fichier ouvert dans un navigateur.'), { enableHighAccuracy: true, timeout: 8000 });
};
document.getElementById('btnCopy').onclick = async e => {
  const data = toJSON();
  try { await navigator.clipboard.writeText(data); e.target.textContent = 'Copié'; }
  catch (err) { e.target.textContent = 'Copie refusée par le navigateur'; }
  setTimeout(() => e.target.textContent = 'Copier les données', 2000);
};
const reset = document.getElementById('btnReset');
reset.onclick = () => {
  if (!reset.dataset.armed) { reset.dataset.armed = '1'; reset.textContent = 'Effacer mes changements ?'; setTimeout(() => { delete reset.dataset.armed; reset.textContent = 'Revenir à l\'exemple'; }, 3000); return; }
  S = sample(); save(); render(); map.setView(C, 16); delete reset.dataset.armed; reset.textContent = 'Revenir à l\'exemple';
};

function render() { drawRoutes(); drawZones(); drawDrailles(); drawPostes(); renderList(); document.getElementById('terrName').textContent = S.terrain; }
render();
if (B()) logEv('info', '<b>Début de la traque « ' + esc(B().nom) + ' »</b>. ' + P().filter(p => p.chasseur).length + ' postes occupés sur ' + P().length + '.');
})();
</script>

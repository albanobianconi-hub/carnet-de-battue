<style>
/* Layout: carte plein écran, bandeau du nom en haut, 4 boutons carrés, bouton Menu en bas à gauche qui ouvre le volet ; orange de sécurité comme seul accent */
:root {
  --bg: #eef0e8;
  --panel: #fbfbf7;
  --ink: #1f2a1c;
  --muted: #5f6b58;
  --line: #d6dbcc;
  --blaze: #e8591a;
  --blaze-ink: #ffffff;
  --moss: #3f5a2e;
  --warn: #b3261e;
  --ok: #2f7d3a;
  --map-fallback: #4a5a3c;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141912; --panel: #1b2218; --ink: #e6eadf; --muted: #9ba692; --line: #2f3a2a;
  --blaze: #ff6a26; --blaze-ink: #1b1005; --moss: #8fb070; --warn: #ff7a70; --ok: #6cc47a; --map-fallback: #26301f;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141912; --panel: #1b2218; --ink: #e6eadf; --muted: #9ba692; --line: #2f3a2a;
  --blaze: #ff6a26; --blaze-ink: #1b1005; --moss: #8fb070; --warn: #ff7a70; --ok: #6cc47a; --map-fallback: #26301f;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blaze); outline-offset: 2px; }

.app { height: 100%; position: relative; }
#map { height: 100%; background: var(--map-fallback); }
#map.no-tiles { background:
  repeating-linear-gradient(45deg, transparent 0 22px, rgba(255,255,255,.04) 22px 23px), var(--map-fallback); }

/* bandeau du nom de l'appli */
.topbar { position: absolute; z-index: 520; top: calc(10px + env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px; background: #1f2a1c; color: #fff; border-radius: 10px; padding: 8px 8px 8px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.brand i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #e8591a; margin-right: 8px; vertical-align: 1px; }
.tb-chip { margin-left: auto; min-width: 0; display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #fff;
  border-radius: 99px; padding: 5px 12px; font-weight: 600; font-size: 13px; }
.tb-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-chip b { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* les 4 boutons carrés */
.tools { position: absolute; z-index: 500; top: calc(66px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  display: flex; gap: 6px; }
.tbtn { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel);
  border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.25); padding: 0; }
.tbtn.on { background: var(--blaze); color: var(--blaze-ink); border-color: var(--blaze); }
.tbtn svg { width: 18px; height: 18px; }
.tbtn span { display: none; }

/* bouton Menu */
.menu-btn { position: absolute; z-index: 560; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));

/* animation d'ouverture */

#splash h1 { margin: 0; font: 700 min(48px, 10.5vw)/1 var(--font-display); text-shadow: 0 2px 18px rgba(0,0,0,.6); letter-spacing: .08em; text-transform: uppercase; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .35em; }
#splash h1 span { display: inline-block; opacity: 0; transform: translateY(22px); animation: sp-up .5s cubic-bezier(.2,.9,.3,1.3) forwards; }

@keyframes sp-draw { to { stroke-dashoffset: 0; } }

}

  opacity: 0; animation: sp-dawn 2.8s ease-out .1s forwards; }

  <svg class="topo" aria-hidden="true"></svg>
  <div class="dawn" aria-hidden="true"></div>
  <div class="mist m1"></div><div class="mist m2"></div><div class="mist m3"></div>

        <line class="tick" x1="105" y1="0" x2="105" y2="24"/><line class="tick" x1="105" y1="186" x2="105" y2="210"/>
        <line class="tick" x1="0" y1="105" x2="24" y2="105"/><line class="tick" x1="186" y1="105" x2="210" y2="105"/></svg>

</div>
<script>
(() => {
  const sp = document.getElementById('splash'); if (!sp) return;
  const ESP = ['Chevreuil', 'Faisan', 'Cerf', 'Bécasse', 'Chamois', 'Perdrix', 'Renard', 'Canard colvert', 'Brocard', 'Lièvre', 'Biche', 'Grive', 'Sanglier'];
  const ul = sp.querySelector('.slot ul');
  ul.innerHTML = ESP.map(e => '<li>' + e + '</li>').join(''); ul.style.setProperty('--n', ESP.length - 1);
  sp.querySelector('h1').innerHTML = ['Carnet', 'de', 'battue'].map((w, i) => '<span style="animation-delay:' + (2.05 + i * .12) + 's">' + w + '</span>').join('');
  // lisière de forêt : trois rangs de sapins, du plus clair (loin) au plus sombre (près)
  const tree = (x, b, w, ht) => 'L' + (x - w / 2).toFixed(1) + ',' + b + 'L' + (x - w * .32).toFixed(1) + ',' + (b - ht * .45).toFixed(1) + 'L' + (x - w * .4).toFixed(1) + ',' + (b - ht * .45).toFixed(1) +
    'L' + (x - w * .2).toFixed(1) + ',' + (b - ht * .75).toFixed(1) + 'L' + (x - w * .28).toFixed(1) + ',' + (b - ht * .75).toFixed(1) + 'L' + x.toFixed(1) + ',' + (b - ht).toFixed(1) +
    'L' + (x + w * .28).toFixed(1) + ',' + (b - ht * .75).toFixed(1) + 'L' + (x + w * .2).toFixed(1) + ',' + (b - ht * .75).toFixed(1) + 'L' + (x + w * .4).toFixed(1) + ',' + (b - ht * .45).toFixed(1) +
    'L' + (x + w * .32).toFixed(1) + ',' + (b - ht * .45).toFixed(1) + 'L' + (x + w / 2).toFixed(1) + ',' + b;
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const rank = (cls, base, hmin, hmax, step) => { let d = 'M0,400L0,' + base; for (let x = 0; x < 1000; x += step * (.7 + rnd() * .6)) { const hh = hmin + rnd() * (hmax - hmin); d += tree(x, base + rnd() * 12, hh * .42, hh); }
    return '<path class="' + cls + '" d="' + d + 'L1000,' + base + 'L1000,400Z"/>'; };
  sp.querySelector('.forest').innerHTML = '<svg viewBox="0 120 1000 280" preserveAspectRatio="xMidYMax slice">' + rank('f1', 250, 60, 110, 26) + rank('f2', 300, 80, 150, 34) + rank('f3', 360, 110, 200, 44) + '</svg>';
  // poussières dorées dans la lumière
  sp.querySelector('.motes').innerHTML = Array.from({ length: 18 }, () => '<i style="left:' + (10 + rnd() * 80).toFixed(0) + '%;top:' + (45 + rnd() * 35).toFixed(0) + '%;--dx:' + ((rnd() - .5) * 60).toFixed(0) + 'px;animation-delay:' + (rnd() * 1.5).toFixed(2) + 's;animation-duration:' + (2 + rnd() * 1.5).toFixed(2) + 's"></i>').join('');
  // courbes de niveau tracées à la volée
  const svg = sp.querySelector('.topo'), W = innerWidth, H = innerHeight; svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const hills = [[W * .22, H * .2], [W * .85, H * .78], [W * .5, H * .52]];
  let html = '';
  hills.forEach(([cx, cy], h) => { for (let k = 1; k <= 7; k++) { const r = k * Math.max(W, H) * .045, pts = [];
    for (let a = 0; a < 64; a++) { const t = a / 64 * Math.PI * 2, w = 1 + .16 * Math.sin(3 * t + h + k * .4) + .08 * Math.sin(5 * t + k);
      pts.push((cx + Math.cos(t) * r * w * 1.25).toFixed(1) + ',' + (cy + Math.sin(t) * r * w).toFixed(1)); }
    html += '<path d="M' + pts.join('L') + 'Z" style="animation-delay:' + (h * .15 + k * .06).toFixed(2) + 's"/>'; } });
  svg.innerHTML = html;
  svg.querySelectorAll('path').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
  let done = false;
  const end = () => { if (done) return; done = true; sp.remove(); };
  sp.addEventListener('click', () => { sp.classList.add('skip'); setTimeout(end, 380); });
  sp.addEventListener('animationend', e => { if (e.target === sp) end(); });
  setTimeout(end, 5400);
})();
</script>

// ---------- carte ----------
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView(C, 16);

const ign = (layer, fmt) => 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=' + layer + '&STYLE=normal&TILEMATRIXSET=PM&FORMAT=' + fmt + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';

  { nom: 'Satellite IGN', l: L.tileLayer(ign('ORTHOIMAGERY.ORTHOPHOTOS', 'image/jpeg'), { maxZoom: 20, maxNativeZoom: 19, attribution: '© IGN Géoplateforme' }) },

];
let tilesOk = 0, tilesErr = 0;
FONDS.forEach(f => { f.l.on('tileload', () => { tilesOk++; document.getElementById('map').classList.remove('no-tiles'); });
                     f.l.on('tileerror', () => { tilesErr++; if (!tilesOk && tilesErr > 4) tileWarn(); }); });
let fondIdx0 = Math.min(S.reglages.fond, FONDS.length - 1);
FONDS[fondIdx0].l.addTo(map);
setTimeout(() => { if (!tilesOk) tileWarn(); }, 4000);
function tileWarn() {
  document.getElementById('map').classList.add('no-tiles');

}
function notice(t) { const n = document.getElementById('notice'); n.textContent = t + ' (touchez pour fermer)'; n.hidden = false; n.onclick = () => n.hidden = true; }

const gRoutes = L.layerGroup().addTo(map), gVus = L.layerGroup().addTo(map);

// géodésie simple (petites distances)
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) { const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const x = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function bearing(a, b) { const y = Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0]))*Math.sin(rad(b[0])) - Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1])); return (deg(Math.atan2(y, x)) + 360) % 360; }
function dest(a, brg, m) { const d = m / R, t = rad(brg), p1 = rad(a[0]), l1 = rad(a[1]);
  const p2 = Math.asin(Math.sin(p1)*Math.cos(d) + Math.cos(p1)*Math.sin(d)*Math.cos(t));
  const l2 = l1 + Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(p1), Math.cos(d) - Math.sin(p1)*Math.sin(p2)); return [deg(p2), deg(l2)]; }
const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const fmtM = m => m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(1).replace('.', ',') + ' km';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Un poste est en conflit si un voisin se trouve dans son secteur de tir élargi de 30° de chaque côté
function conflits(p) {
  return P().filter(q => q.id !== p.id && dist([p.lat,p.lng],[q.lat,q.lng]) < 400 &&
    angDiff(bearing([p.lat,p.lng],[q.lat,q.lng]), p.orient) < p.ouv/2 + S.reglages.angle);
}

function drawPostes() {
  gPostes.clearLayers(); gSect.clearLayers();
  P().forEach(p => {
    const c = conflits(p);
    const pts = [[p.lat,p.lng]];
    for (let a = p.orient - p.ouv/2; a <= p.orient + p.ouv/2 + .01; a += 5) pts.push(dest([p.lat,p.lng], a, S.reglages.portee));
    L.polygon(pts, { color: c.length ? '#ff5a4f' : '#ff8a3d', weight: 1.5, fillOpacity: .18, dashArray: c.length ? '4 4' : null, interactive: false }).addTo(gSect);
    const m = L.marker([p.lat,p.lng], { draggable: true, icon: L.divIcon({ className: '', html: '<div class="mk-poste' + (c.length ? ' alert' : '') + '">' + p.num + '</div>', iconSize: [30,30], iconAnchor: [15,15] }) });
    m.bindPopup(() => popPoste(p), { maxWidth: 260, autoPanPaddingTopLeft: L.point(12, 70) });
    m.on('dragend', e => { const ll = e.target.getLatLng(); p.lat = ll.lat; p.lng = ll.lng; save(); render(); });
    m.addTo(gPostes); p._m = m;
  });
}
function popPoste(p) {
  const c = conflits(p);
  const d = document.createElement('div'); d.className = 'pop';
  d.innerHTML = '<h3>Poste ' + p.num + ' · ' + esc(p.nom) + '</h3>' +
    (p.photo ? '<img alt="Photo du poste ' + p.num + '" src="' + p.photo + '">' : '') +
    '<div class="m">' + (p.chasseur ? 'Posté : <b>' + esc(p.chasseur) + '</b><br>' : 'Poste libre<br>') +
    'Tir vers ' + Math.round(p.orient) + '° · ouverture ' + p.ouv + '°' + (p.notes ? '<br>' + esc(p.notes) : '') + '</div>' +
    (c.length ? '<div style="margin-top:6px"><span class="chip warn">Angle 30° : poste' + (c.length > 1 ? 's ' : ' ') + c.map(q => q.num).join(', ') + '</span></div>' : '');
  const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Modifier'; b.onclick = () => { map.closePopup(); editPoste(p); };

}
function stopDraw() {
  mode = null; draft = []; if (draftLine) { map.removeLayer(draftLine); draftLine = null; }
  bar.hidden = true; menuBtn.hidden = false; map.getContainer().style.cursor = '';
  document.getElementById('btnPoste').classList.remove('on'); document.getElementById('btnDraille').classList.remove('on');
}
map.on('click', e => {
  if (mode === 'spot') {
    const sp = { id: 's' + Date.now(), nom: 'Nouveau spot', type: 'Plaine', lat: e.latlng.lat, lng: e.latlng.lng, notes: '' };
    stopDraw(); editSpot(sp, true); return;
  }
  if (mode === 'poste') {
    const n = P().reduce((m, p) => Math.max(m, p.num), 0) + 1;
    const p = { id: 'p' + Date.now(), num: n, nom: 'Poste ' + n, chasseur: '', lat: e.latlng.lat, lng: e.latlng.lng, orient: 180, ouv: 90, photo: '', notes: '' };
    stopDraw(); editPoste(p, true);
  } else if (mode === 'draille' || mode === 'zone') {
    draft.push([e.latlng.lat, e.latlng.lng]);
    if (!draftLine) draftLine = (mode === 'zone' ? L.polygon(draft, { color: '#fff', weight: 2, dashArray: '6 6', fillOpacity: .12 }) : L.polyline(draft, { color: '#ff8a3d', weight: 4, dashArray: '9 7' })).addTo(map);
    else draftLine.setLatLngs(draft);
    msg.textContent = draft.length + ' point' + (draft.length > 1 ? 's' : '') + ' · ' + (mode === 'zone' && draft.length > 2 ? fmtHa(surfaceHa(draft)) : fmtM(len(draft)));
  }
});
ok.onclick = () => {
  if (mode === 'zone') { if (draft.length < 3) { msg.textContent = 'Posez au moins trois points'; return; }
    const b = { id: 'b' + Date.now(), nom: 'Nouvelle battue', couleur: ZONE_COLORS[S.battues.length % ZONE_COLORS.length], notes: '', zone: draft.slice(), postes: [] };
    stopDraw(); editBattue(b, true); return; }
  if (draft.length < 2) { msg.textContent = 'Posez au moins deux points'; return; }
  const d = { id: 'd' + Date.now(), nom: 'Nouvelle draille', gibier: 'sanglier', notes: '', pts: draft.slice() }; stopDraw(); editDraille(d, true); };
document.getElementById('drawCancel').onclick = stopDraw;
document.getElementById('btnPoste').onclick = () => {
  if (mode === 'poste') return stopDraw();
  if (!B()) { openDrawer('battue');
    return notice('Choisissez d\'abord une battue dans l\'onglet Battue : chaque poste appartient à une battue.'); }
  startDraw('poste');
};
document.getElementById('btnDraille').onclick = () => mode === 'draille' ? stopDraw() : startDraw('draille');
let fondIdx = fondIdx0;
document.getElementById('btnFond').onclick = () => {
  map.removeLayer(FONDS[fondIdx].l); fondIdx = (fondIdx + 1) % FONDS.length; FONDS[fondIdx].l.addTo(map);
  document.getElementById('fondLbl').textContent = FONDS[fondIdx].nom; document.getElementById('btnFond').title = 'Fond : ' + FONDS[fondIdx].nom;
};
let me = null;
document.getElementById('btnMoi').onclick = () => {
  if (!navigator.geolocation) return notice('La localisation n\'est pas disponible sur cet appareil.');
  navigator.geolocation.getCurrentPosition(p => { const ll = [p.coords.latitude, p.coords.longitude];
      if (me) map.removeLayer(me); me = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#1e88ff', fillOpacity: 1 }).addTo(map); map.setView(ll, 17); },
    () => notice('Position refusée ou indisponible. Dans cet aperçu la localisation est bloquée ; elle fonctionne dans le fichier ouvert dans un navigateur.'), { enableHighAccuracy: true, timeout: 8000 });
};
function render() {
  drawRoutes(); drawZones(); drawDrailles(); drawSpots(); drawPostes(); if (tab !== 'reglages') renderList(); else document.getElementById('nBattues').textContent = S.battues.length;
  document.getElementById('terrName').textContent = S.terrain;
  const b = B(); document.getElementById('topBattueLbl').innerHTML = b ? (b.live && !b.live.fini ? '<span class="dot-live"></span>' : '') + esc(b.nom) : 'Choisir une battue';
  const sw = document.getElementById('topSw'); sw.style.background = b ? b.couleur : 'transparent'; sw.hidden = !b;
}
render();
const fl = document.getElementById('fondLbl'); if (fl) fl.textContent = FONDS[fondIdx].nom;
if (B() && B().live && !B().live.fini && dbURL()) connect(B());
setInterval(() => { if (LIVE.es && tab === 'direct' && drawer.classList.contains('open')) renderList(); drawMembres(); }, 30000);
if (B()) logEv('info', '<b>Début de la traque « ' + esc(B().nom) + ' »</b>. ' + P().filter(p => p.chasseur).length + ' postes occupés sur ' + P().length + '.');
})();
</script>

<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
